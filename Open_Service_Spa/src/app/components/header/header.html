<header class="main-header">
  <div class="container menu">
    <img class="logo-1" src="assets/logo.png" alt="Logo Open Service">
    
    <input type="checkbox" id="menu" [checked]="menuOpen" (change)="toggleMenu()">
    <label for="menu" class="menu-label">
      <img src="assets/menu.png" class="menu-icono" alt="Menu">
    </label>

    <div class="menu-overlay" (click)="toggleMenu()"></div>
    
    <nav class="navbar">
      <div class="menu-1">
        <ul>
          <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Inicio</a></li>
          <li><a routerLink="/nosotros" routerLinkActive="active">Nosotros</a></li>
          <li><a routerLink="/servicios" routerLinkActive="active">Servicios</a></li>
          <li><a routerLink="/productos" routerLinkActive="active">Productos</a></li>
          <li><a routerLink="/contacto" routerLinkActive="active">Contacto</a></li>
        </ul>
      </div>

      <img class="logo-2" src="assets/logo.png" alt="Logo">

      <div class="menu-2">
        <ul>
          <li><a routerLink="/horario" routerLinkActive="active">Horario</a></li>
        </ul>

        <div class="socials">
          <a href="#">
            <div class="social">
              <img src="assets/s1.svg" alt="Facebook">
            </div>
          </a>
          <a href="#">
            <div class="social">
              <img src="assets/s2.svg" alt="Instagram">
            </div>
          </a>
          <a href="#">
            <div class="social">
              <img src="assets/s3.svg" alt="WhatsApp">
            </div>
          </a>
        </div>
      </div>

      <div class="authorized-brands">
        <div class="brand-logos">
          <img src="assets/logoMarca.png" alt="Servicio Técnico Bosch">
        </div>
      </div>

    </nav>
  </div>
</header>
