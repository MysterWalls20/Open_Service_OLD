<div class="page-container">
  <div class="page-header">
    <h1>Inventario</h1>
    <button class="btn-primary" (click)="openForm()">+ Nuevo Artículo</button>
  </div>

  <div class="table-container">
    @if (articulos.length > 0) {
      <table class="data-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          @for (a of articulos; track a.idArticulo) {
            <tr>
              <td>{{ a.idArticulo }}</td>
              <td>{{ a.nombre }}</td>
              <td>{{ a.descripcion }}</td>
              <td>S/ {{ a.precio }}</td>
              <td>{{ a.stockDisponible }}</td>
              <td class="actions">
                <button class="btn-icon btn-edit" (click)="editArticulo(a)">✏️</button>
                <button class="btn-icon btn-delete" (click)="deleteArticulo(a.idArticulo)">🗑️</button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    }
  </div>

  @if (showForm) {
    <div class="modal-overlay" (click)="closeForm()">
      <div class="modal-content" (click)="$event.stopPropagation()">
        <h2>{{ editingId ? 'Editar' : 'Nuevo' }}</h2>
        <form class="form-grid" (ngSubmit)="saveArticulo()">
          <div class="form-group">
            <label>Nombre</label>
            <input type="text" [(ngModel)]="formModel.nombre" name="nombre" required>
          </div>
          <div class="form-group">
            <label>Descripción</label>
            <input type="text" [(ngModel)]="formModel.descripcion" name="descripcion">
          </div>
          <div class="form-group">
            <label>Precio</label>
            <input type="number" [(ngModel)]="formModel.precio" name="precio" required>
          </div>
          <div class="form-group">
            <label>Stock Disponible</label>
            <input type="number" [(ngModel)]="formModel.stockDisponible" name="stockDisponible" required>
          </div>
          <div class="form-actions">
            <button type="button" class="btn-secondary" (click)="closeForm()">Cancelar</button>
            <button type="submit" class="btn-primary">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  }
</div>
